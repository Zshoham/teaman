name: CI

# `test` runs the typecheck + unit suite + a full prod build on every push/PR.
# `integration` packs the engine as a real tarball and builds the example vault
#   through the installed CLI — the consumer path the in-repo build can't see.
# `e2e` builds the production site and runs the Playwright suite against it.
# `binaries` builds the single-file binary for every platform and runs the
#   Linux one with nothing on PATH; `release` attaches them to a tag's release.
# `publish` runs only after all of those pass, and only on main pushes /
#   version tags — so a release can never ship untested or unpackageable.
#
# Two release channels to the public npm registry:
#   - push to main        -> prerelease  X.Y.Z-dev.g<sha> @ dist-tag `dev`
#   - push tag vX.Y.Z     -> release      X.Y.Z           @ dist-tag `latest`
# The dev version is just the committed package.json version plus the commit's
# short SHA — no guessing the next bump level. Stale main runs skip publishing so
# `@dev` is not repointed backwards when pushes overlap.
# Auth is npm trusted publishing (OIDC) — no token; the trusted publisher for this
# repo+workflow is configured in the npm package settings. Publishes carry build
# provenance automatically.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2 # the version in package.json `packageManager`
      - run: bun install --frozen-lockfile
      # astro sync generates .astro/types.d.ts (astro:content module types),
      # which tsconfig includes — a fresh checkout has none until then.
      - run: bun run typecheck
      - run: bun run build:all
      - run: bun run test

  # Consumer path: pack the engine, install the tarball into a throwaway project
  # outside the repo, and build the example vault through the installed CLI. Runs
  # its own install of the tarball, so no `bun install` here — it catches packaging
  # bugs (missing `files`/`dependencies`, unresolvable bin) the in-repo build can't.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2 # the version in package.json `packageManager`
      - run: bun run test:integration

  # Browser suite: the Playwright config's webServer builds the production site
  # and serves it via `astro preview`, then runs the e2e/ specs against it.
  # `bunx playwright install --with-deps chromium` pulls the headless browser
  # binary and the system libraries it needs on a clean Ubuntu runner. The
  # Playwright runner itself runs on the runner's preinstalled Node (it does not
  # support Bun); the site it tests is built and served by Bun.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2 # the version in package.json `packageManager`
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e

  # The single-file binaries (scripts/build-binary.mjs): the Bun runtime plus
  # the packed engine, for hosts with no Bun, Node or npm. Every target
  # cross-compiles on this one Linux runner — Bun cross-compiles the runtime,
  # and each target's native dependencies are installed by OS/CPU. The Linux
  # binary is then run with an empty PATH against the example vault, which is
  # the one check that the binary needs nothing from the machine. (The others
  # cannot run here.) Nothing to install: the build packs the engine itself.
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2 # the version in package.json `packageManager`
      - name: Build
        run: |
          for target in bun-linux-x64 bun-linux-arm64 bun-darwin-x64 bun-darwin-arm64 bun-windows-x64; do
            bun scripts/build-binary.mjs --target "$target"
          done
      - name: Build the example vault with the Linux binary alone
        run: |
          mkdir -p "$RUNNER_TEMP/empty-path"
          cp -r example "$RUNNER_TEMP/vault"
          env PATH="$RUNNER_TEMP/empty-path" TEAMAN_CACHE_DIR="$RUNNER_TEMP/teaman-cache" \
            "$PWD/dist-bin/teaman-linux-x64" build "$RUNNER_TEMP/vault"
          for artifact in index.html slides/intro/index.html pagefind/pagefind.js references/rust-reference/reference.pdf; do
            test -f "$RUNNER_TEMP/vault/dist/$artifact" || { echo "missing $artifact"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: teaman-binaries
          path: dist-bin/
          compression-level: 0 # already zstd inside
          retention-days: 7

  # A version tag's binaries go on its GitHub release, once everything passed.
  release:
    needs: [test, integration, e2e, binaries]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: teaman-binaries
          path: dist-bin
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist-bin/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist-bin/* --verify-tag --generate-notes
          fi

  publish:
    needs: [test, integration, e2e, binaries]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # bundles npm >= 11.5.1, which supports OIDC trusted publishing
          registry-url: https://registry.npmjs.org
      # npm, not bun, publishes: npm trusted publishing (OIDC) and provenance
      # are npm CLI features. No install needed: the package ships source (see `files` in package.json),
      # and the `test` job already validated install + build.
      - name: Resolve version and publish
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            DIST_TAG=latest
          else
            # Skip if a newer commit already became origin/main, so an overlapping
            # stale run can't repoint @dev backwards.
            git fetch --no-tags --depth=1 origin main
            CURRENT=$(git rev-parse origin/main)
            if [[ "$GITHUB_SHA" != "$CURRENT" ]]; then
              echo "Skipping publish: $GITHUB_SHA is no longer origin/main ($CURRENT)."
              exit 0
            fi
            BASE=$(jq -r .version package.json)
            SHA=$(git rev-parse --short HEAD)
            VERSION="$BASE-dev.g$SHA"
            DIST_TAG=dev
          fi
          echo "Publishing $VERSION (dist-tag: $DIST_TAG)"
          npm version --no-git-tag-version --allow-same-version "$VERSION"
          npm publish --tag "$DIST_TAG"
